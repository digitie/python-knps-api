[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "python-knps-api"
version = "0.2.0"
description = "Unofficial Python client for Korea National Park Service public file datasets."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "GPL-3.0-or-later" }
authors = [
  { name = "digitie" }
]
keywords = ["korea", "national-park", "knps", "data.go.kr", "trail", "geodata"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = [
  "httpx>=0.27",
  "pydantic>=2.7",
  "boto3>=1.34",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "ruff>=0.5",
  "mypy>=1.10",
  "types-boto3[s3]",
]
debug-ui = [
  "pandas>=2",
  "streamlit>=1.36",
]
geo = [
  "pyproj>=3.6",
  "pyshp>=2.3",
]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]
include = ["knps*"]

[tool.setuptools.package-data]
knps = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
files = ["src", "examples"]

# examples/streamlit_debug_ui.py는 pandas/streamlit을 사용한다. 둘 다 debug-ui
# extra(선택 의존성)라서 stub 패키지가 없을 수 있고, KNPS 코어 타입과도
# 무관해서 missing import를 무시한다. 나머지 strict 규칙은 그대로 적용된다.
[[tool.mypy.overrides]]
module = ["pandas", "pandas.*", "streamlit", "streamlit.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra -m 'not live'"
asyncio_mode = "auto"
markers = [
  "live: tests that call real KNPS/data.go.kr file dataset servers",
]
